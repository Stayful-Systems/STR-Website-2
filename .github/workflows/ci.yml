name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Review R4 (R4-32): the production build, so a build-only failure (a
      # Next.js security gate, a server/client import mix-up) fails CI rather
      # than a release. It needs no secrets: every key is read at request time.
      - name: Build
        run: npm run build

  # The database half of CI (Batch 21, G4): supabase/schema.sql on a fresh
  # Postgres 16 behind a Supabase stand-in, run twice so every statement is
  # proven idempotent, then the ledger and schema checks. Nothing in the unit
  # tests reaches the credit_* functions, where the money actually moves.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-in (roles, auth.users, storage, pgcrypto)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/shim.sql
      - name: schema.sql on a fresh database
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Dump after the first run
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d postgres --schema-only --no-owner | grep -vE '^(-- Dumped|SET |SELECT pg_catalog|\\restrict |\\unrestrict )' > /tmp/schema1.sql
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d postgres --data-only --inserts --no-owner --exclude-schema=auth --exclude-schema=storage | grep -vE '^(-- Dumped|SET |SELECT pg_catalog|\\restrict |\\unrestrict )' > /tmp/data1.sql
      # Review R4 (R4-47): a re-run must leave every index alone (a rebuild locks the table while crons write to
      # it); si_calls_log_deal_uidx was rebuilt on every run before. The dump diff can't see a rebuild: the oid can.
      - name: Note every index after the first run
        run: psql -tAc "select string_agg(c.relname || ' ' || c.oid, E'\\n' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'i'" > /tmp/index1.txt
      - name: schema.sql again (every statement must be idempotent)
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: The second run rebuilt no index
        run: |
          psql -tAc "select string_agg(c.relname || ' ' || c.oid, E'\\n' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'i'" > /tmp/index2.txt
          grep -q '^si_calls_log_deal_uidx ' /tmp/index1.txt
          diff /tmp/index1.txt /tmp/index2.txt
      - name: The second run changed nothing
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d postgres --schema-only --no-owner | grep -vE '^(-- Dumped|SET |SELECT pg_catalog|\\restrict |\\unrestrict )' > /tmp/schema2.sql
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d postgres --data-only --inserts --no-owner --exclude-schema=auth --exclude-schema=storage | grep -vE '^(-- Dumped|SET |SELECT pg_catalog|\\restrict |\\unrestrict )' > /tmp/data2.sql
          diff /tmp/schema1.sql /tmp/schema2.sql
          diff /tmp/data1.sql /tmp/data2.sql
      - name: Ledger and schema checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/credit-smoke.sql
      - name: Properties scanned checks (Batch 22e)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/scan-days-smoke.sql
      - name: Starter pack bonus, cap and unlock checks (Batch 29)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pack-smoke.sql
      - name: Buy-to-let screen writes and the daily rate sync (Review R4, R4-48)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/btl-smoke.sql
      - name: Website report cap, claim and charge checks (Batch 31)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/websites-smoke.sql
      - name: Plan credit rollover, idle report and clawback checks (Batch 34)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rollover-smoke.sql
      - name: Lead database link and delivery table checks (Batch 32)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/leaddb-smoke.sql
      - name: Website domain spend cap, one-per-site and charge checks (Batch 33)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domains-smoke.sql
      - name: Ad pack tables and lead link checks (Batch 36)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/adpacks-smoke.sql
      - name: Website edit versions, grace notices and delete-restrict checks (Batch 36)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/websites-p4-smoke.sql
